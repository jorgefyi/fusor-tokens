<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem("theme");
          if (t === "dark" || t === "light")
            document.documentElement.setAttribute("data-theme", t);
          if (t === "dark") document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
    <link rel="stylesheet" href="/tokens.css" />
    <link rel="stylesheet" href="/app.css" />
    <link rel="icon" href="/favicon.svg" />
    <title>Shift counter</title>
  </head>
  <body>
    <App state="{{ App::new() }}">
      <section class="shell">
        <article class="panel">
          <header class="panel-head">
            <p class="eyebrow">Fusor tokens</p>
            <h1>Shift</h1>
          </header>
          <p class="count" aria-live="polite">{{ state.count.get() }}</p>
          <div class="row">
            <button type="button" class="btn btn-quiet" on:click="state.decrement()">Minus</button>
            <button type="button" class="btn btn-primary" on:click="state.increment()">Plus</button>
          </div>
          <ThemeToggle></ThemeToggle>
          <p class="warn-copy">Cutoff in 2 hours. This line uses color.warning.fg.</p>
        </article>
      </section>
    </App>
  </body>
</html>
