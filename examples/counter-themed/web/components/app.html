<section class="shell">
  <article class="panel">
    <header class="panel-head">
      <p class="eyebrow">Fusor tokens</p>
      <h1>Shift</h1>
    </header>
    <p class="count" aria-live="polite">{{ count }}</p>
    <div class="row">
      <button type="button" class="btn btn-quiet" on:click="decrement()">Minus</button>
      <button type="button" class="btn btn-primary" on:click="increment()">Plus</button>
    </div>
    <theme-toggle></theme-toggle>
    <p class="warn-copy">Cutoff in 2 hours. This line uses color.warning.fg.</p>
  </article>
</section>
