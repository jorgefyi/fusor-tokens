<div class="theme" role="group" aria-label="Theme">
  <button
    type="button"
    class="btn"
    class:primary="theme == 'light'"
    class:quiet="theme != 'light'"
    on:click="set_light()"
  >
    Light
  </button>
  <button
    type="button"
    class="btn"
    class:primary="theme == 'dark'"
    class:quiet="theme != 'dark'"
    on:click="set_dark()"
  >
    Dark
  </button>
</div>
