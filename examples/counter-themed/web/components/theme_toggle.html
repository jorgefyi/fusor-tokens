<template rust:component="ThemeToggle">
  <div class="theme" role="group" aria-label="Theme">
    <button
      type="button"
      class="btn"
      class:primary='state.theme.get() == "light"'
      class:quiet='state.theme.get() != "light"'
      on:click="state.set_light()"
    >
      Light
    </button>
    <button
      type="button"
      class="btn"
      class:primary='state.theme.get() == "dark"'
      class:quiet='state.theme.get() != "dark"'
      on:click="state.set_dark()"
    >
      Dark
    </button>
  </div>
</template>
