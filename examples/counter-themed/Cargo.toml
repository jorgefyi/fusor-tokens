[package]
name = "counter-themed"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false
description = "Fusor app that consumes Tesso tokens and components."

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
fusor-core = { version = "=0.1.5", features = ["dom"] }
fusor-components = { version = "=0.1.5", features = ["browser"] }
wasm-bindgen = "=0.2.117"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlElement", "Node", "Event", "EventTarget", "HtmlDialogElement", "DomTokenList", "Storage", "MediaQueryList"] }

[build-dependencies]
fusor-build = "=0.1.5"

[package.metadata.fusor]
entry = "web/index.html"
assets = "public"
assets-build = ["npx", "tesso-ui", "build"]
output = "dist"
base-path = "/"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
